name: EC2 자동 배포 (Develop)

on:
  push:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    env:
      DEPLOY_BRANCH: ${{ github.ref_name }}

    steps:
      - name: EC2 자동 배포
        shell: bash
        run: |
          set -euo pipefail

          BACK_DIR=/home/ubuntu/2026_fall_festival_back

          echo "배포 브랜치: $DEPLOY_BRANCH"

          cd "$BACK_DIR"

          git fetch origin
          git switch -C "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"

          docker compose -f deploy/docker-compose.prod.yml build web

          docker compose -f deploy/docker-compose.prod.yml run --rm web \
            python manage.py migrate --noinput

          docker compose -f deploy/docker-compose.prod.yml run --rm web \
            python manage.py collectstatic --noinput

          # 기존 Nginx는 살려둔 채 백엔드를 먼저 반영한다.
          docker compose -f deploy/docker-compose.prod.yml up -d redis web

          # 새 마운트와 Nginx 설정을 임시 컨테이너에서 먼저 검증한다.
          docker compose -f deploy/docker-compose.prod.yml run --rm --no-deps nginx \
            nginx -t

          # bind mount된 설정 변경이 반영되도록 Nginx만 재생성한다.
          docker compose -f deploy/docker-compose.prod.yml up -d \
            --no-deps --force-recreate nginx

          docker exec dgufesta_nginx nginx -t

          docker image prune -f

          docker compose -f deploy/docker-compose.prod.yml ps

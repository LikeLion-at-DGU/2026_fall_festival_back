[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fall-festival-back"
version = "0.1.0"
description = "Backend API for the 2026 Dongguk University fall festival"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16,<4.0",
    "django-cors-headers>=4.7,<5.0",
    "django-environ>=0.12,<1.0",
    "drf-spectacular>=0.28,<1.0",
    "gunicorn>=23,<24",
    "Pillow>=11,<13",
    "psycopg[binary]>=3.2,<4.0",
    "korcen>=1.0.3,<2.0",
    "requests>=2.34,<3.0",
    "PyJWT>=2.14,<3.0",
    "redis>=6,<9",
    "django-storages[s3]>=1.14.6,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-django>=4.10,<5",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["api*", "apps*", "common*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests", "apps"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Cloudflare가 전달한 원래 요청 프로토콜(https) 유지
# X-Forwarded-Proto가 없는 요청은 Nginx scheme 사용
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# 1. Django 백엔드 컨테이너 정의 (Docker 내부 네트워크 통신)
upstream django_backend {
    server web:8000;
}

# ========================================================
# 2. 일반 사용자 사이트 (dgufesta.com & IP 직접 접속 허용)
# ========================================================
server {
    listen 80 default_server;
    server_name _ localhost 13.209.252.16 dgufesta.com www.dgufesta.com;

    client_max_body_size 20M;

    # (1) index.html 최신 버전 보장 (no-cache)
    location = /index.html {
        root /usr/share/nginx/html/user;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # (2) React/Vite 정적 빌드 파일 캐싱 헤더 (1년)
    location /assets/ {
        root /usr/share/nginx/html/user;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # (3) Django 정적 파일 & 미디어 파일 서빙
    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    # (4) 일반 도메인에서 관리자 화면 경로 차단
    location = /admin {
        return 404;
    }

    location ^~ /admin/ {
        return 404;
    }

    # (5) API 요청은 Django 백엔드(Gunicorn)로 프록시 전달
    location /api/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # (6) 일반 웹 화면 요청 (React SPA 라우팅 지원)
    location / {
        root /usr/share/nginx/html/user;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# ========================================================
# 3. 관리자 사이트 (admin.dgufesta.com)
# ========================================================
server {
    listen 80;
    server_name admin.dgufesta.com;

    client_max_body_size 20M;

    # (1) 관리자 index.html 최신 버전 보장 (no-cache)
    location = /index.html {
        root /usr/share/nginx/html/admin;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # (2) 관리자 React 에셋 캐싱
    location /assets/ {
        root /usr/share/nginx/html/admin;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # (3) 관리자 정적 파일 & 미디어 파일 서빙
    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    # (4) 관리자 API 요청도 Django 백엔드로 프록시 전달
    location /api/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # (5) 관리자 웹 화면 요청 (React Admin SPA 라우팅)
    location / {
        root /usr/share/nginx/html/admin;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

services:
  # 1. Redis 캐시 컨테이너 (Look-aside 패턴 전용, 256MB 제한)
  redis:
    image: redis:7-alpine
    container_name: dgufesta_redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - dgufesta_net

  # 2. Django 백엔드 컨테이너 (Gunicorn gthread)
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: dgufesta-backend:latest
    container_name: dgufesta_backend
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      REDIS_URL: redis://redis:6379/1
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    depends_on:
      - redis
    networks:
      - dgufesta_net

  # 3. Nginx 웹서버 (EC2 호스트의 cloudflared에서만 접근)
  nginx:
    image: nginx:alpine
    container_name: dgufesta_nginx
    restart: unless-stopped

    ports:
      - "127.0.0.1:80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

      - static_volume:/app/staticfiles
      - media_volume:/app/media

      # React 사용자/관리자 빌드 결과물
      - /home/ubuntu/2026_fall_festival_front/dist-next/user:/usr/share/nginx/html/user:ro
      - /home/ubuntu/2026_fall_festival_front/dist-next/admin:/usr/share/nginx/html/admin:ro

    depends_on:
      - web

    networks:
      - dgufesta_net

# 공용 저장 공간(볼륨) 정의
volumes:
  static_volume:
  media_volume:
  redis_data:

# 컨테이너 간 내부 격리 네트워크 정의
networks:
  dgufesta_net:
    driver: bridge
